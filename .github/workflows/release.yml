name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group dev -e .
      - name: The tag is the package version
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          import uniquedomains
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              sys.exit(f"{tag} is not a release tag (vX.Y.Z, no pre-release).")
          if tag != f"v{version}" or uniquedomains.__version__ != version:
              sys.exit(f"The tag {tag}, pyproject.toml {version} and __version__ {uniquedomains.__version__} disagree.")
          print(f"Releasing {version}")
          PY
      - run: python scripts/check_text.py
      - run: python scripts/generate.py --offline --check
      - run: python -m pytest
      - name: Live smoke (free endpoints only)
        run: python -m pytest -m live
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uniquedomains/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
