name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also check the snapshot against the live document and run the live smoke (about 24 keyless calls)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group test -e .
      - run: python -m pytest

  checks:
    name: Lint, types, generated code, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group dev -e .
      - name: Text rules
        run: python scripts/check_text.py
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Types
        run: mypy
      - name: The generated code matches the committed snapshot
        run: python scripts/generate.py --offline --check
      - name: Build
        run: |
          python -m build
          twine check --strict dist/*
      - name: The built wheel passes the tests in a clean environment
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/python -m pip install dist/*.whl pytest
          /tmp/wheel/bin/python -m pytest -p no:cacheprovider tests
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  live:
    name: Live document and smoke
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group dev -e .
      - name: The snapshot matches the live document
        run: python scripts/generate.py --check
      - name: Live smoke (free endpoints only)
        if: always()
        run: python -m pytest -m live
